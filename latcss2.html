<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
        background-color: #eeeeee;

      }
      header{
        background-color: black;
        color: #eeeeee;
        text-align: center;
        padding: 25px;
      }
      nav {
        background-color: #e754db;
        padding: 15px;
      }
      nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 30px;
      }
      nav ul li a {
        color: aliceblue;
        text-decoration: none;
        font-size: 18px;
      }
      nav a:hover{
        color:#00bfff
      }
      main{
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }
      section{
        width: 400px;
        background-color: aliceblue;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2)
      }
      section h2{
        text-align: center;
        margin-bottom: 20px;
      }
      form{
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      label{
        font-weight: bold;
        margin-bottom: 5px;
      }
      input,textarea{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      textarea{
        height: 100px;
        resize: none;
      }
      fieldset{
        border: none;
      }
      legend{
        font-weight: bold;
        margin-bottom: 10px;
      }
      fieldset label{
        width: auto;
      }
      fieldset input[type="radio"]{

      }
      label[for="alamat"]{
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .tombol{
        padding: 12px;
        background-color: aquamarine;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
footer{
    background-color: black;
    color: #eeeeee;
    text-align: center;
    padding: 200px;
}

    </style>
  </head>
  <body>
    <header>
      <h1>SMKN 4 TASIKMALAYA</h1>
      <p>Pendaftaran siswa baru</p>
    </header>

    <nav>
      <ul>
        <li><a href="#">beranda</a></li>
        <li><a href="#">tentang</a></li>
        <li><a href="#">pendaftaran</a></li>
        <li><a href="#">kontak</a></li>
      </ul>
    </nav>
    <main>
      <section>
        <h2>Form pendaftaran</h2>
        <form action="" method="post">
          <label for="nama">Nama lengkap</label>
          <input type="text" name="nama" id="" placeholder="masukan nama lengkap" />
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="masukan email" />
          <label for="password">password</label>
          <input type="password" name="password" id="password" placeholder="masukan password" />
          <fieldset>
            <legend>Jenis kelamin</legend>
            <input type="radio" name="jenis_kelamin" id="" />laki-laki 
            <input type="radio" name="jenis_kelamin" id="" />perempuan
            <label for="alamat">alamat</label>
            <textarea name="alamt" id=""></textarea>
            <input class="tombol" type="submit" value="daftar">
        </form>
      </section>
    </main>
    <footer>
        <p>&copy; 2026 khaliva ira</p>
    </footer>
  </body>
</html>
